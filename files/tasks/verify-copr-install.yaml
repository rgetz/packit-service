# Make sure ogr, specfile and packit were actually installed from the
# expected Copr repo, and not silently pulled from the official Fedora
# repos (e.g. because Copr was unreachable during the build).

- name: Check which repo ogr, specfile and packit were installed from
  ansible.builtin.command:
    cmd: dnf repoquery --installed --qf '%{name} %{from_repo}\n' python3-ogr python3-specfile packit
  register: copr_pkg_repos
  changed_when: false

- name: Fail if any package was not installed from the expected Copr repo
  ansible.builtin.assert:
    that:
      - "('copr:copr.fedorainfracloud.org:packit:' ~ copr_repo_enabled) in item"
    fail_msg: >-
      {{ item }} was not installed from packit/{{ copr_repo_enabled }} on Copr.
      This usually means the Copr repo was unreachable during the build and
      dnf silently fell back to the official Fedora repos.
  loop: "{{ copr_pkg_repos.stdout_lines }}"
